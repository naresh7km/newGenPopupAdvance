name: Create New Site and Update Link

on:
  workflow_dispatch:
    inputs:
      frequency_seconds:
        description: 'Rotation frequency in seconds'
        required: true
        default: '120'
        type: choice
        options:
          - '60'
          - '120'
          - '180'
          - '300'
          - '600'
      delete_after_seconds:
        description: 'Delete old sites after (seconds)'
        required: true
        default: '1200'
        type: choice
        options:
          - '600'
          - '1200'
          - '1800'
          - '2700'
          - '3600'

jobs:
  create-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout static site repo
        uses: actions/checkout@v4
        with:
          repository: naresh7km/v2-test_environment
          path: static-site

      - name: Configure git
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "forge-bot"
          git config user.email "bot@noreply.github.com"
          git remote set-url origin "https://x-access-token:$GH_TOKEN@github.com/naresh7km/newGenPopupAdvance.git"

      - name: Pre-zip static site
        run: cd static-site && zip -r ../site.zip . && cd ..

      - name: Run 6-hour link rotation loop
        env:
          NETLIFY_TOKEN:       ${{ secrets.NETLIFY_TOKEN }}
          FREQUENCY:           ${{ inputs.frequency_seconds }}
          DELETE_AFTER:        ${{ inputs.delete_after_seconds }}
        run: |
          START_TIME=$(date +%s)
          MAX_DURATION=21300
          ITERATION=0
          PREV_SITE_ID=""
          declare -A DELETE_QUEUE

          echo "Rotation: every ${FREQUENCY}s | delete old sites after ${DELETE_AFTER}s"

          while true; do
            NOW=$(date +%s)
            ELAPSED=$((NOW - START_TIME))
            [ $ELAPSED -ge $MAX_DURATION ] && echo "6h limit reached, stopping." && break

            ITERATION=$((ITERATION + 1))
            echo ""
            echo "=========================================="
            echo "ITERATION $ITERATION | $(date '+%H:%M:%S') | elapsed: ${ELAPSED}s"
            echo "=========================================="

            # ── Check deletion queue ──────────────────────────────────────
            for QID in "${!DELETE_QUEUE[@]}"; do
              if [ "$NOW" -ge "${DELETE_QUEUE[$QID]}" ]; then
                echo "DELETING old site: $QID"
                curl -sf -X DELETE \
                  -H "Authorization: Bearer $NETLIFY_TOKEN" \
                  "https://api.netlify.com/api/v1/sites/$QID" \
                  && echo "DELETED: $QID" || echo "Delete failed (may already be gone): $QID"
                unset DELETE_QUEUE[$QID]
              else
                WAIT=$(( ${DELETE_QUEUE[$QID]} - NOW ))
                echo "Pending delete: $QID (in ${WAIT}s)"
              fi
            done

            # ── 1. Create Netlify site ────────────────────────────────────
            echo "[1/4] Creating Netlify site..."
            SITE_RESPONSE=$(curl -sf -X POST \
              -H "Authorization: Bearer $NETLIFY_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.netlify.com/api/v1/sites" -d "{}")
            SITE_ID=$(echo "$SITE_RESPONSE" | jq -r '.id')
            SITE_URL=$(echo "$SITE_RESPONSE" | jq -r '.ssl_url // .url')

            if [ -z "$SITE_ID" ] || [ "$SITE_ID" = "null" ]; then
              echo "ERROR: Netlify create failed, skipping iteration"
              sleep "$FREQUENCY"
              continue
            fi
            echo "Site: $SITE_URL"

            # ── 2. Deploy static files ────────────────────────────────────
            echo "[2/4] Deploying..."
            DEPLOY_RESPONSE=$(curl -sf -X POST \
              -H "Authorization: Bearer $NETLIFY_TOKEN" \
              -H "Content-Type: application/zip" \
              --data-binary "@site.zip" \
              "https://api.netlify.com/api/v1/sites/$SITE_ID/deploys")
            DEPLOY_ID=$(echo "$DEPLOY_RESPONSE" | jq -r '.id')

            if [ -z "$DEPLOY_ID" ] || [ "$DEPLOY_ID" = "null" ]; then
              echo "ERROR: Deploy failed, skipping iteration"
              sleep "$FREQUENCY"
              continue
            fi

            # ── 3. Wait for deploy ────────────────────────────────────────
            echo "[3/4] Waiting for deploy..."
            for i in $(seq 1 20); do
              STATE=$(curl -sf \
                -H "Authorization: Bearer $NETLIFY_TOKEN" \
                "https://api.netlify.com/api/v1/deploys/$DEPLOY_ID" \
                | jq -r '.state')
              echo "  Deploy[$i]: $STATE"
              [ "$STATE" = "ready" ] && echo "  Live!" && break
              [ "$STATE" = "error" ] && echo "  Deploy error!" && break
              sleep 8
            done

            # ── 4. Update server.js ───────────────────────────────────────
            echo "[4/4] Updating server.js..."
            git pull --rebase origin main 2>/dev/null || true
            sed -i "/miyabikinjp\.dqwzavw2upc3z\.amplifyapp\.com/ s|target: \"[^\"]*\"|target: \"$SITE_URL\"|" server.js
            git add server.js
            if ! git diff --cached --quiet; then
              git commit -m "iter[$ITERATION] dmc → $SITE_URL"
              git push origin main
              echo "LIVE_URL: $SITE_URL"

              # Queue previous site for deletion now that new one is live
              if [ -n "$PREV_SITE_ID" ]; then
                DELETE_AT=$(( $(date +%s) + DELETE_AFTER ))
                DELETE_QUEUE[$PREV_SITE_ID]=$DELETE_AT
                echo "QUEUED FOR DELETE: $PREV_SITE_ID (in ${DELETE_AFTER}s)"
              fi
              PREV_SITE_ID="$SITE_ID"
            fi

            REMAINING=$((MAX_DURATION - ELAPSED))
            echo "Sleeping ${FREQUENCY}s | ~${REMAINING}s left in session"
            sleep "$FREQUENCY"
          done

          # ── Final cleanup: delete anything still in queue ─────────────────
          echo ""
          echo "Session ended. Running final deletion cleanup..."
          for QID in "${!DELETE_QUEUE[@]}"; do
            echo "Deleting: $QID"
            curl -sf -X DELETE \
              -H "Authorization: Bearer $NETLIFY_TOKEN" \
              "https://api.netlify.com/api/v1/sites/$QID" || true
          done
          echo "Done. Total iterations: $ITERATION"
