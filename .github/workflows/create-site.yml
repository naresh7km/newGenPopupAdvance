name: Create New Forge Site

on:
  workflow_dispatch:

jobs:
  create-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate random site name
        id: naming
        run: |
          ADJ=(swift calm bold kind warm cool brave sunny happy lucky eager fresh bright sharp clean pure)
          NOUN=(tiger eagle hawk wolf bear fox raven shark whale lion crane panda koala robin falcon)
          A=${ADJ[$RANDOM % ${#ADJ[@]}]}
          N=${NOUN[$RANDOM % ${#NOUN[@]}]}
          NAME="${A}-${N}-$(date +%s)"
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "Site name will be: $NAME"

      - name: Create Forge site
        id: site
        env:
          FORGE_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
          SERVER_ID:   ${{ secrets.FORGE_SERVER_ID }}
          NAME:        ${{ steps.naming.outputs.name }}
        run: |
          RESPONSE=$(curl -sf -X POST \
            -H "Authorization: Bearer $FORGE_TOKEN" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d "{\"domain\":\"$NAME.test\",\"project_type\":\"html\",\"directory\":\"/\"}" \
            "https://forge.laravel.com/api/v1/servers/$SERVER_ID/sites")
          echo "Forge response: $RESPONSE"
          SITE_ID=$(echo "$RESPONSE" | jq -r '.site.id')
          [ -z "$SITE_ID" ] || [ "$SITE_ID" = "null" ] && echo "Failed: $RESPONSE" && exit 1
          echo "site_id=$SITE_ID" >> $GITHUB_OUTPUT
          echo "Site created: ID=$SITE_ID"

      - name: Wait for site to be installed
        env:
          FORGE_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
          SERVER_ID:   ${{ secrets.FORGE_SERVER_ID }}
          SITE_ID:     ${{ steps.site.outputs.site_id }}
        run: |
          for i in $(seq 1 30); do
            STATUS=$(curl -sf \
              -H "Authorization: Bearer $FORGE_TOKEN" \
              -H "Accept: application/json" \
              "https://forge.laravel.com/api/v1/servers/$SERVER_ID/sites/$SITE_ID" \
              | jq -r '.site.status')
            echo "[$i/30] Status: $STATUS"
            [ "$STATUS" = "installed" ] && echo "Site ready!" && break
            [ "$i" = "30" ] && echo "Timeout waiting for install" && exit 1
            sleep 10
          done

      - name: Debug - check available domain fields
        env:
          FORGE_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
          SERVER_ID:   ${{ secrets.FORGE_SERVER_ID }}
          SITE_ID:     ${{ steps.site.outputs.site_id }}
        run: |
          echo "=== Full site object from Forge ==="
          curl -s \
            -H "Authorization: Bearer $FORGE_TOKEN" \
            -H "Accept: application/json" \
            "https://forge.laravel.com/api/v1/servers/$SERVER_ID/sites/$SITE_ID" | jq .

          echo ""
          echo "=== POST forge-domain response ==="
          curl -s -X POST \
            -H "Authorization: Bearer $FORGE_TOKEN" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            "https://forge.laravel.com/api/v1/servers/$SERVER_ID/sites/$SITE_ID/forge-domain"

          echo ""
          echo "=== GET forge-domain response ==="
          curl -s \
            -H "Authorization: Bearer $FORGE_TOKEN" \
            -H "Accept: application/json" \
            "https://forge.laravel.com/api/v1/servers/$SERVER_ID/sites/$SITE_ID/forge-domain"
