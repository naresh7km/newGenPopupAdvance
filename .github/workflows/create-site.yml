name: Create New Site and Update Link

on:
  workflow_dispatch:

jobs:
  create-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create Netlify site
        id: netlify
        env:
          NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
        run: |
          RESPONSE=$(curl -sf -X POST \
            -H "Authorization: Bearer $NETLIFY_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.netlify.com/api/v1/sites" \
            -d "{}")
          echo "Netlify response: $RESPONSE"
          SITE_ID=$(echo "$RESPONSE" | jq -r '.id')
          SITE_URL=$(echo "$RESPONSE" | jq -r '.ssl_url // .url')
          [ -z "$SITE_ID" ] || [ "$SITE_ID" = "null" ] && echo "Failed: $RESPONSE" && exit 1
          echo "site_id=$SITE_ID" >> $GITHUB_OUTPUT
          echo "url=$SITE_URL"    >> $GITHUB_OUTPUT
          echo "Site created: $SITE_URL"

      - name: Checkout static site repo
        uses: actions/checkout@v4
        with:
          repository: naresh7km/v2-test_environment
          path: static-site

      - name: Zip and deploy to Netlify
        id: deploy
        env:
          NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
          SITE_ID: ${{ steps.netlify.outputs.site_id }}
        run: |
          cd static-site && zip -r ../site.zip . && cd ..
          RESPONSE=$(curl -sf -X POST \
            -H "Authorization: Bearer $NETLIFY_TOKEN" \
            -H "Content-Type: application/zip" \
            --data-binary "@site.zip" \
            "https://api.netlify.com/api/v1/sites/$SITE_ID/deploys")
          echo "Deploy response: $RESPONSE"
          DEPLOY_ID=$(echo "$RESPONSE" | jq -r '.id')
          [ -z "$DEPLOY_ID" ] || [ "$DEPLOY_ID" = "null" ] && echo "Deploy failed: $RESPONSE" && exit 1
          echo "deploy_id=$DEPLOY_ID" >> $GITHUB_OUTPUT
          echo "Deploy started: $DEPLOY_ID"

      - name: Wait for Netlify deploy to finish
        env:
          NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
          DEPLOY_ID: ${{ steps.deploy.outputs.deploy_id }}
        run: |
          for i in $(seq 1 30); do
            STATE=$(curl -sf \
              -H "Authorization: Bearer $NETLIFY_TOKEN" \
              "https://api.netlify.com/api/v1/deploys/$DEPLOY_ID" \
              | jq -r '.state')
            echo "[$i/30] State: $STATE"
            [ "$STATE" = "ready" ] && echo "Live!" && break
            [ "$STATE" = "error" ] && echo "Deploy failed!" && exit 1
            [ "$i" = "30" ] && echo "Timeout" && exit 1
            sleep 10
          done

      - name: Checkout main repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update dmc target in server.js
        env:
          NEW_URL: ${{ steps.netlify.outputs.url }}
        run: |
          echo "Updating dmc target to: $NEW_URL"
          sed -i "/miyabikinjp\.dqwzavw2upc3z\.amplifyapp\.com/ s|target: \"[^\"]*\"|target: \"$NEW_URL\"|" server.js
          echo "--- dmc section after update ---"
          grep -A3 "dmc:" server.js

      - name: Commit and push
        env:
          NEW_URL: ${{ steps.netlify.outputs.url }}
        run: |
          git config user.name "forge-bot"
          git config user.email "bot@noreply.github.com"
          git add server.js
          if git diff --cached --quiet; then
            echo "No changes detected"
          else
            git commit -m "chore: dmc target → $NEW_URL"
            git push
            echo "Done! Link updated to: $NEW_URL"
          fi
