name: Forge Site Loop

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forge-site-loop
  cancel-in-progress: false

jobs:
  create-sites:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    env:
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
      FORGE_SERVER_ID: ${{ secrets.FORGE_SERVER_ID }}

      FORGE_REPOSITORY: ${{ vars.FORGE_REPOSITORY }}
      FORGE_BRANCH: ${{ vars.FORGE_BRANCH }}

      SOURCE_ORIGIN_URL: ${{ vars.SOURCE_ORIGIN_URL }}
      INDEX_JS_PATH: ${{ vars.INDEX_JS_PATH }}

      WAIT_SECONDS: ${{ vars.WAIT_SECONDS }}
      MAX_SITES_PER_RUN: ${{ vars.MAX_SITES_PER_RUN }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ vars.FORGE_BRANCH }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Install Laravel Forge SDK
        run: |
          composer require laravel/forge-sdk --no-interaction --prefer-dist

      - name: Create temporary Forge script
        run: |
          mkdir -p tools

          cat > tools/forge-create-site.php <<'PHP'
          <?php

          require __DIR__ . '/../vendor/autoload.php';

          use Laravel\Forge\Forge;

          function required_env(string $key): string
          {
              $value = getenv($key);

              if ($value === false || trim($value) === '') {
                  fwrite(STDERR, "Missing environment variable: {$key}\n");
                  exit(1);
              }

              return trim($value);
          }

          function optional_env(string $key, string $default): string
          {
              $value = getenv($key);

              if ($value === false || trim($value) === '') {
                  return $default;
              }

              return trim($value);
          }

          function random_site_name(): string
          {
              $left = [
                  'bright', 'silent', 'rapid', 'golden', 'happy',
                  'cosmic', 'fresh', 'lucky', 'magic', 'swift',
                  'clever', 'flying', 'gentle', 'brave', 'sunny',
                  'crimson', 'silver', 'hidden', 'wild', 'calm',
                  'noble', 'mellow', 'proud', 'quiet', 'sharp',
              ];

              $right = [
                  'fox', 'panda', 'falcon', 'otter', 'tiger',
                  'comet', 'river', 'forest', 'cloud', 'spark',
                  'rocket', 'planet', 'wave', 'stone', 'leaf',
                  'pixel', 'shell', 'breeze', 'shadow', 'nova',
                  'lion', 'eagle', 'wolf', 'storm', 'ember',
              ];

              return $left[array_rand($left)] . '-' . $right[array_rand($right)] . '-' . strtolower(bin2hex(random_bytes(3)));
          }

          function update_index_js(string $filePath, string $sourceOriginUrl, string $newTargetUrl): void
          {
              if (!file_exists($filePath)) {
                  fwrite(STDERR, "Could not find INDEX_JS_PATH file: {$filePath}\n");
                  exit(1);
              }

              $content = file_get_contents($filePath);

              if ($content === false) {
                  fwrite(STDERR, "Could not read file: {$filePath}\n");
                  exit(1);
              }

              $quotedSource = preg_quote($sourceOriginUrl, '/');

              $pattern = '/("' . $quotedSource . '"\s*:\s*")([^"]+)(")/';

              $newContent = preg_replace(
                  $pattern,
                  '$1' . $newTargetUrl . '$3',
                  $content,
                  1,
                  $count
              );

              if ($newContent === null) {
                  fwrite(STDERR, "Regex replacement failed.\n");
                  exit(1);
              }

              if ($count < 1) {
                  fwrite(STDERR, "Could not find this exact source URL inside {$filePath}:\n{$sourceOriginUrl}\n");
                  exit(1);
              }

              file_put_contents($filePath, $newContent);

              echo "Updated {$filePath}\n";
              echo "Changed target URL to: {$newTargetUrl}\n";
          }

          $forgeToken = required_env('FORGE_API_TOKEN');
          $serverId = (int) required_env('FORGE_SERVER_ID');

          $repository = required_env('FORGE_REPOSITORY');
          $branch = optional_env('FORGE_BRANCH', 'main');

          $sourceOriginUrl = required_env('SOURCE_ORIGIN_URL');
          $indexJsPath = optional_env('INDEX_JS_PATH', 'public/index.js');

          $forge = new Forge($forgeToken);
          $forge->setTimeout(240);

          $siteName = random_site_name();
          $domain = $siteName . '.on-forge.com';
          $siteUrl = 'https://' . $domain;

          echo "Creating Forge site: {$domain}\n";

          /*
           * Important:
           * Forge default web directory is /public.
           * Your repo must have public/index.html and public/index.js.
           */
          $site = $forge->createSite($serverId, [
              'domain' => $domain,
              'project_type' => 'html',
              'directory' => '/public',
              'nginx_template' => 'default',
          ], true);

          echo "Created Forge site ID: {$site->id}\n";
          echo "Forge URL: {$siteUrl}\n";

          echo "Installing GitHub repo: {$repository}\n";
          echo "Branch: {$branch}\n";

          $forge->installGitRepositoryOnSite($serverId, $site->id, [
              'provider' => 'github',
              'repository' => $repository,
              'branch' => $branch,
              'composer' => false,
          ]);

          /*
           * Static HTML deploy script.
           * This avoids composer/npm/artisan commands.
           */
          $deployScript = <<<SCRIPT
          cd /home/forge/{$domain}/current

          git pull origin {$branch}
          SCRIPT;

          echo "Updating Forge deploy script for static HTML...\n";

          $forge->updateSiteDeploymentScript($serverId, $site->id, $deployScript);

          update_index_js($indexJsPath, $sourceOriginUrl, $siteUrl);

          $metadataFile = 'forge-created-sites.json';

          $metadata = [];

          if (file_exists($metadataFile)) {
              $decoded = json_decode(file_get_contents($metadataFile), true);

              if (is_array($decoded)) {
                  $metadata = $decoded;
              }
          }

          $metadata[] = [
              'site_id' => $site->id,
              'domain' => $domain,
              'url' => $siteUrl,
              'repository' => $repository,
              'branch' => $branch,
              'created_at_utc' => gmdate('c'),
          ];

          file_put_contents(
              $metadataFile,
              json_encode($metadata, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . PHP_EOL
          );

          file_put_contents(
              'last-forge-site.json',
              json_encode([
                  'site_id' => $site->id,
                  'domain' => $domain,
                  'url' => $siteUrl,
              ], JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . PHP_EOL
          );

          echo "Saved metadata.\n";
          echo "SITE_ID={$site->id}\n";
          echo "SITE_URL={$siteUrl}\n";
          PHP

          cat > tools/forge-deploy-last-site.php <<'PHP'
          <?php

          require __DIR__ . '/../vendor/autoload.php';

          use Laravel\Forge\Forge;

          $forgeToken = getenv('FORGE_API_TOKEN');
          $serverId = getenv('FORGE_SERVER_ID');

          if (!$forgeToken || !$serverId) {
              fwrite(STDERR, "Missing Forge environment variables.\n");
              exit(1);
          }

          if (!file_exists('last-forge-site.json')) {
              fwrite(STDERR, "Missing last-forge-site.json\n");
              exit(1);
          }

          $lastSite = json_decode(file_get_contents('last-forge-site.json'), true);

          if (!isset($lastSite['site_id'])) {
              fwrite(STDERR, "Invalid last-forge-site.json\n");
              exit(1);
          }

          $forge = new Forge($forgeToken);

          echo "Deploying Forge site ID: {$lastSite['site_id']}\n";

          $forge->deploySite((int) $serverId, (int) $lastSite['site_id']);

          echo "Deploy triggered.\n";
          PHP

      - name: Configure Git user
        run: |
          git config user.name "forge-site-bot"
          git config user.email "forge-site-bot@users.noreply.github.com"

      - name: Run Forge loop
        run: |
          set -e

          MAX="${MAX_SITES_PER_RUN:-15}"
          WAIT="${WAIT_SECONDS:-300}"
          BRANCH="${FORGE_BRANCH:-main}"

          echo "Max sites this run: $MAX"
          echo "Wait between sites: $WAIT seconds"
          echo "Branch: $BRANCH"

          for i in $(seq 1 "$MAX"); do
            echo ""
            echo "===================================="
            echo "Creating Forge site $i of $MAX"
            echo "===================================="

            git pull --rebase origin "$BRANCH"

            php tools/forge-create-site.php

            git add "$INDEX_JS_PATH" forge-created-sites.json last-forge-site.json

            if git diff --cached --quiet; then
              echo "No Git changes to commit."
            else
              git commit -m "Update Forge target URL $i"
              git push origin "$BRANCH"
              echo "Pushed updated URL to GitHub."
            fi

            echo "Waiting 30 seconds before triggering Forge deploy..."
            sleep 30

            php tools/forge-deploy-last-site.php

            if [ "$i" -lt "$MAX" ]; then
              echo "Waiting $WAIT seconds before next site..."
              sleep "$WAIT"
            fi
          done

          echo "Finished Forge loop."
