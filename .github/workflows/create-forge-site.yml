name: Create One Laravel Forge Site

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forge-site-creator
  cancel-in-progress: false

jobs:
  create-site:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
      FORGE_SERVER_ID: ${{ vars.FORGE_SERVER_ID }}
      FORGE_SOURCE_REPOSITORY: ${{ vars.FORGE_SOURCE_REPOSITORY }}
      FORGE_SOURCE_BRANCH: ${{ vars.FORGE_SOURCE_BRANCH }}
      TARGET_INDEX_FILE: ${{ vars.TARGET_INDEX_FILE }}
      TARGET_MAP_ORIGIN: ${{ vars.TARGET_MAP_ORIGIN }}
      FORGE_DOMAIN_PREFIX: ${{ vars.FORGE_DOMAIN_PREFIX }}
      SITE_INSTALL_WAIT_SECONDS: ${{ vars.SITE_INSTALL_WAIT_SECONDS }}

    steps:
      - name: Checkout newGenPopupAdvance repo
        uses: actions/checkout@v4

      - name: Validate required values
        run: |
          test -n "$FORGE_API_TOKEN" || (echo "Missing FORGE_API_TOKEN secret" && exit 1)
          test -n "$FORGE_SERVER_ID" || (echo "Missing FORGE_SERVER_ID variable" && exit 1)
          test -n "$FORGE_SOURCE_REPOSITORY" || (echo "Missing FORGE_SOURCE_REPOSITORY variable" && exit 1)
          test -n "$FORGE_SOURCE_BRANCH" || (echo "Missing FORGE_SOURCE_BRANCH variable" && exit 1)
          test -n "$TARGET_INDEX_FILE" || (echo "Missing TARGET_INDEX_FILE variable" && exit 1)
          test -n "$TARGET_MAP_ORIGIN" || (echo "Missing TARGET_MAP_ORIGIN variable" && exit 1)
          test -f "$TARGET_INDEX_FILE" || (echo "Cannot find $TARGET_INDEX_FILE" && exit 1)

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Install Laravel Forge SDK
        run: |
          composer require laravel/forge-sdk:^3.0 --no-interaction --no-progress

      - name: Create Forge site and update server.js
        run: |
          cat > forge-create-site.php <<'PHP'
          <?php

          require __DIR__ . '/vendor/autoload.php';

          use Laravel\Forge\Forge;

          function envValue(string $key, ?string $default = null): string
          {
              $value = getenv($key);

              if ($value === false || $value === '') {
                  if ($default !== null) {
                      return $default;
                  }

                  fwrite(STDERR, "Missing environment value: {$key}\n");
                  exit(1);
              }

              return $value;
          }

          function randomSlug(int $length = 10): string
          {
              $letters = 'abcdefghijklmnopqrstuvwxyz';
              $chars = 'abcdefghijklmnopqrstuvwxyz0123456789';

              $slug = $letters[random_int(0, strlen($letters) - 1)];

              for ($i = 1; $i < $length; $i++) {
                  $slug .= $chars[random_int(0, strlen($chars) - 1)];
              }

              return $slug;
          }

          function objectToArray($value): array
          {
              return json_decode(json_encode($value), true) ?: [];
          }

          function findForgeSiteUrl(array $siteData): ?string
          {
              $possibleKeys = [
                  'forge_site_url',
                  'forgeSiteUrl',
                  'forge_url',
                  'forgeUrl',
                  'url',
              ];

              foreach ($possibleKeys as $key) {
                  if (! empty($siteData[$key]) && is_string($siteData[$key])) {
                      return normalizeUrl($siteData[$key]);
                  }
              }

              if (! empty($siteData['site']) && is_array($siteData['site'])) {
                  return findForgeSiteUrl($siteData['site']);
              }

              return null;
          }

          function normalizeUrl(string $url): string
          {
              $url = trim($url);

              if ($url === '') {
                  return $url;
              }

              if (! str_starts_with($url, 'http://') && ! str_starts_with($url, 'https://')) {
                  $url = 'https://' . $url;
              }

              return rtrim($url, '/');
          }

          function updateMappingFile(string $filePath, string $originUrl, string $newUrl): void
          {
              if (! file_exists($filePath)) {
                  fwrite(STDERR, "File not found: {$filePath}\n");
                  exit(1);
              }

              $content = file_get_contents($filePath);
              $escapedOrigin = preg_quote($originUrl, '/');

              $pattern = '/("' . $escapedOrigin . '"\s*:\s*\{[^}]*?target\s*:\s*")[^"]*(")/s';

              $newContent = preg_replace(
                  $pattern,
                  '${1}' . $newUrl . '${2}',
                  $content,
                  1,
                  $count
              );

              if ($count !== 1) {
                  fwrite(STDERR, "Could not find exactly one target mapping for origin URL: {$originUrl}\n");
                  fwrite(STDERR, "Expected this kind of format:\n");
                  fwrite(STDERR, "\"{$originUrl}\": { method: \"iframe\", target: \"https://old-url.com\" }\n");
                  exit(1);
              }

              file_put_contents($filePath, $newContent);
          }

          $token = envValue('FORGE_API_TOKEN');
          $serverId = (int) envValue('FORGE_SERVER_ID');
          $repository = envValue('FORGE_SOURCE_REPOSITORY');
          $branch = envValue('FORGE_SOURCE_BRANCH', 'main');
          $targetFile = envValue('TARGET_INDEX_FILE', 'server.js');
          $originUrl = envValue('TARGET_MAP_ORIGIN');
          $prefix = envValue('FORGE_DOMAIN_PREFIX', 'jp-core');
          $installWaitSeconds = (int) envValue('SITE_INSTALL_WAIT_SECONDS', '180');

          $siteSlug = $prefix . '-' . randomSlug(10);

          /*
           * Important:
           * We are NOT using this as the final public URL.
           * Forge should return the real free on-forge.com URL.
           */
          $primaryDomain = $siteSlug . '.example.com';

          echo "Creating Forge static HTML site...\n";
          echo "Temporary primary domain: {$primaryDomain}\n";
          echo "Source repo: {$repository}\n";
          echo "Branch: {$branch}\n";
          echo "Web directory: /public\n";

          $forge = new Forge($token);
          $forge->setTimeout(180);

          $site = $forge->createSite($serverId, [
              'domain' => $primaryDomain,
              'project_type' => 'html',
              'directory' => '/public',
          ]);

          $siteData = objectToArray($site);
          file_put_contents(
              'forge-created-site-debug.json',
              json_encode($siteData, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES)
          );

          echo "Created site raw response:\n";
          echo json_encode($siteData, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . "\n";

          $siteId = $siteData['id'] ?? $siteData['site']['id'] ?? null;

          if (! $siteId) {
              fwrite(STDERR, "Could not find Forge site ID in API response.\n");
              fwrite(STDERR, "Check forge-created-site-debug.json in the failed Action logs.\n");
              exit(1);
          }

          echo "Created site ID: {$siteId}\n";

          echo "Waiting {$installWaitSeconds} seconds for Forge site setup...\n";
          sleep($installWaitSeconds);

          echo "Refreshing site data from Forge...\n";
          $freshSite = $forge->site($serverId, $siteId);
          $freshSiteData = objectToArray($freshSite);

          file_put_contents(
              'forge-refreshed-site-debug.json',
              json_encode($freshSiteData, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES)
          );

          echo "Refreshed site response:\n";
          echo json_encode($freshSiteData, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . "\n";

          $forgeUrl = findForgeSiteUrl($freshSiteData);

          if (! $forgeUrl || ! str_contains($forgeUrl, 'on-forge.com')) {
              fwrite(STDERR, "\nForge did not return a usable free on-forge.com URL.\n");
              fwrite(STDERR, "This means the API/SDK path we are using is creating the Nginx site, but not attaching the new Forge Domain system.\n");
              fwrite(STDERR, "Look inside forge-refreshed-site-debug.json in the Action logs.\n");
              fwrite(STDERR, "Do not continue because updating GitHub with a guessed URL would create another broken link.\n");
              exit(1);
          }

          echo "Real Forge URL found: {$forgeUrl}\n";

          echo "Installing GitHub repository on Forge site...\n";

          $forge->installGitRepositoryOnSite($serverId, $siteId, [
              'provider' => 'github',
              'repository' => $repository,
              'branch' => $branch,
              'composer' => false,
          ], false);

          echo "Waiting 120 seconds for Git install...\n";
          sleep(120);

          echo "Setting static HTML deploy script...\n";

          $deployScript = <<<BASH
          if [ -n "\$FORGE_SITE_PATH" ] && [ -d "\$FORGE_SITE_PATH" ]; then
              cd "\$FORGE_SITE_PATH"
          else
              cd /home/forge/{$primaryDomain}
          fi

          git fetch origin {$branch}
          git reset --hard origin/{$branch}
          git clean -fd

          echo "Static HTML deployment finished"
          BASH;

          $forge->updateSiteDeploymentScript($serverId, $siteId, $deployScript);

          echo "Triggering first deploy...\n";
          $forge->deploySite($serverId, $siteId, false);

          echo "Waiting 150 seconds after deploy trigger...\n";
          sleep(150);

          echo "Updating {$targetFile}: target for {$originUrl} => {$forgeUrl}\n";
          updateMappingFile($targetFile, $originUrl, $forgeUrl);

          file_put_contents('forge-created-site.txt', $forgeUrl . PHP_EOL);
          file_put_contents('forge-created-site-id.txt', (string) $siteId . PHP_EOL);

          echo "Done. Real Forge URL: {$forgeUrl}\n";
          PHP

          php forge-create-site.php

      - name: Show created site
        run: |
          echo "Created Forge URL:"
          cat forge-created-site.txt

          echo "Created Forge Site ID:"
          cat forge-created-site-id.txt

      - name: Commit server.js update
        run: |
          NEW_URL="$(cat forge-created-site.txt)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$TARGET_INDEX_FILE" forge-created-site.txt forge-created-site-id.txt forge-created-site-debug.json forge-refreshed-site-debug.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update Forge site target to ${NEW_URL}"
          git push
